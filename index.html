<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LikeChat</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/logo.jpg">
</head>
<body>
<!-- Wallpaper latar -->
<div id="wallpaper" aria-hidden="true">
  <img id="wpImg" alt="">
  <video id="wpVideo" muted loop playsinline></video>
</div>

<div id="app">
  <!-- Kepala: tanpa garis, melayang -->
  <header id="topbar">
    <button id="menuBtn" class="icon-btn" data-i18n-aria="menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
    </button>
    <button id="modelBtn" class="model-btn" data-i18n-aria="selectModel" aria-label="Pilih model AI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
    </button>
    <button id="moreBtn" class="icon-btn" data-i18n-aria="settings" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>
  <div id="modelMenu" class="dropdown hidden" role="menu"></div>

  <!-- Area chat -->
  <main id="chat" aria-live="polite">
    <div id="emptyState">
      <img src="assets/logo.jpg" alt="LikeChat" class="logo-big">
      <div class="app-title">LikeChat</div>
    </div>
    <div id="messages"></div>
  </main>

  <!-- Penulis pesan -->
  <div id="composer">
    <button id="plusBtn" class="circle-btn" data-i18n-aria="add" aria-label="Tambah">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div id="plusMenu" class="hidden" role="menu">
      <button class="plus-item" data-plus="gallery" data-i18n-aria="gallery" aria-label="Galeri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg><span data-i18n="gallery">Galeri</span></button>
      <button class="plus-item" data-plus="camera" data-i18n-aria="camera" aria-label="Kamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span data-i18n="camera">Kamera</span></button>
      <button class="plus-item" data-plus="file" data-i18n-aria="file" aria-label="File"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span data-i18n="file">File</span></button>
      <button class="plus-item" data-plus="generate" data-i18n-aria="genImage" aria-label="Buat Gambar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="genImage">Buat Gambar</span></button>
      <button class="plus-item" data-plus="edit" data-i18n-aria="editImage" aria-label="Edit Gambar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-i18n="editImage">Edit Gambar</span></button>
      <button class="plus-item" data-plus="videogen" data-i18n-aria="genVideo" aria-label="Buat Video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg><span data-i18n="genVideo">Buat Video</span></button>
      <button class="plus-item" data-plus="videoanim" data-i18n-aria="animImage" aria-label="Animasi Gambar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/><path d="M3 8h18M3 16h18"/></svg><span data-i18n="animImage">Animasi Gambar</span></button>
    </div>
    <div id="inputPill">
      <div id="modeChip" class="hidden"><span id="modeChipText"></span><button id="modeChipX" class="mini-btn" data-i18n-aria="cancel" aria-label="Batal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div id="attachBar" class="hidden"><img id="attachImg" alt=""><span id="attachName"></span><button id="attachX" class="mini-btn" data-i18n-aria="removeAttach" aria-label="Hapus lampiran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <textarea id="input" rows="1" data-i18n-ph="writeMsg" placeholder="Tulis pesan..."></textarea>
    </div>
    <div id="sendCol">
      <button id="micBtn" class="circle-btn" data-i18n-aria="voiceInput" aria-label="Input suara">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
      </button>
      <button id="sendBtn" class="circle-btn" data-i18n-aria="send" aria-label="Kirim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </div>
  </div>

  <input type="file" id="fileGallery" accept="image/*" hidden>
  <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileAny" hidden>
  <input type="file" id="fileEditImg" accept="image/*" hidden>
  <input type="file" id="fileAnimImg" accept="image/*" hidden>
  <input type="file" id="fileWallpaper" accept="image/*,video/*" hidden>
</div>

<!-- Lapisan gelap -->
<div id="scrim" class="hidden"></div>

<!-- Drawer kiri -->
<aside id="drawer" data-i18n-aria="mainMenu" aria-label="Menu utama">
  <div class="drawer-head">
    <img src="assets/logo.jpg" alt="" class="logo-small">
    <span class="drawer-title">LikeChat</span>
  </div>
  <nav class="drawer-nav">
    <button class="drawer-item" data-act="new" data-i18n-aria="newChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-i18n="newChat">Pesan Baru</span></button>
    <button class="drawer-item" data-act="search" data-i18n-aria="searchChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span data-i18n="searchChat">Cari Pesan</span></button>
    <div id="searchBox" class="hidden"><input id="searchInput" type="search" data-i18n-ph="searchPh" placeholder="Cari pesan..."></div>
    <button class="drawer-item" data-act="history" data-i18n-aria="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span data-i18n="history">Riwayat Pesan</span></button>
    <div id="historyList" class="hidden"></div>
    <button class="drawer-item" data-act="clear" data-i18n-aria="clearHistory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><span data-i18n="clearHistory">Hapus Riwayat</span></button>
    <button class="drawer-item" data-act="info" data-i18n-aria="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/></svg><span data-i18n="info">Info</span></button>
    <button class="drawer-item" id="accountBtn" data-act="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg><span id="accountLabel" data-i18n="account">Akun</span></button>
  </nav>
</aside>

<!-- Panel akun -->
<aside id="accountPanel" data-i18n-aria="account" aria-label="Akun">
  <button class="icon-btn panel-x" data-close="accountPanel" data-i18n-aria="close" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <div class="acc-profile">
    <img id="accPhoto" class="acc-photo" data-i18n-alt="profilePhoto" alt="Foto profil">
    <div id="accName" class="acc-name"></div>
    <div id="accEmail" class="acc-email"></div>
  </div>
  <nav class="drawer-nav">
    <button class="drawer-item" id="accFilesBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span data-i18n="savedFiles">File Tersimpan</span></button>
    <button class="drawer-item" id="accImagesBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span data-i18n="attachedImages">Gambar Terlampir</span></button>
    <button class="drawer-item" id="accLogoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span id="accLogoutLabel">Keluar</span></button>
  </nav>
  <div id="accList" class="acc-list"></div>
</aside>

<!-- Panel info -->
<aside id="infoPanel" data-i18n-aria="info" aria-label="Info">
  <button class="icon-btn panel-x" data-close="infoPanel" data-i18n-aria="close" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <img src="assets/logo.jpg" alt="" class="logo-small">
  <p>Web app ini langsung di ciptakan Oleh Keluarga Besar <b>"SR Produksi"</b> Indonesia. Jika anda Menemukan Bug Atau Error Dan Sejenis Silahkan Hubungi Kami Melalui</p>
  <a href="mailto:hestia.sri.rosee@gmail.com">hestia.sri.rosee@gmail.com</a>
</aside>

<!-- Sidebar pengaturan -->
<aside id="settings" data-i18n-aria="settings" aria-label="Pengaturan">
  <button class="icon-btn panel-x" data-close="settings" data-i18n-aria="close" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <h3 data-i18n="mode">Mode</h3>
  <div id="modeRow">
    <button data-mode="gelap" data-i18n-aria="darkMode" aria-label="Mode gelap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span data-i18n="dark">Gelap</span></button>
    <button data-mode="terang" data-i18n-aria="lightMode" aria-label="Mode terang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="light">Terang</span></button>
  </div>
  <h3 data-i18n="wallpaper">Wallpaper</h3>
  <div id="wpCats"></div>
  <button id="wpUploadBtn" class="wide-btn" data-i18n-aria="uploadWallpaper" aria-label="Unggah wallpaper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg></button>
  <h3 data-i18n="btnColor">Warna Tombol</h3>
  <div id="colorRow"></div>
  <h3 data-i18n="language">Bahasa</h3>
  <div id="langRow">
    <button data-lang="id"><span>Indonesia</span></button>
    <button data-lang="en"><span>English</span></button>
  </div>
</aside>

<!-- Penampil kode -->
<aside id="codePanel" data-i18n-aria="viewCode" aria-label="Lihat kode">
  <div class="code-head">
    <span id="codeLang">code</span>
    <div class="code-actions">
      <button class="icon-btn" id="codeClose" data-i18n-aria="exit" aria-label="Keluar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <button class="icon-btn" id="codeCopy" data-i18n-aria="copy" aria-label="Salin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button class="icon-btn" id="codeRetry" data-i18n-aria="retry" aria-label="Ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg></button>
      <button class="icon-btn" id="codeDelete" data-i18n-aria="del" aria-label="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>
  </div>
  <pre id="codeBody"><code></code></pre>
</aside>

<!-- Penampil gambar -->
<div id="imgViewer" class="hidden" data-i18n-aria="viewImage" aria-label="Lihat gambar">
  <img id="imgViewerImg" data-i18n-alt="image" alt="Gambar">
  <div class="img-viewer-actions">
    <button class="icon-btn" id="imgViewerClose" data-i18n-aria="close" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <button class="icon-btn" id="imgViewerDownload" data-i18n-aria="download" aria-label="Unduh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
    <button class="icon-btn" id="imgViewerDelete" data-i18n-aria="del" aria-label="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
  </div>
</div>

<!-- Popup aksi pesan -->
<div id="msgPopup" class="hidden" role="menu">
  <button class="icon-btn" id="msgCopy" data-i18n-aria="copy" aria-label="Salin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
  <button class="icon-btn" id="msgRetry" data-i18n-aria="retry" aria-label="Ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg></button>
  <button class="icon-btn" id="msgDelete" data-i18n-aria="del" aria-label="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
</div>

<!-- Popup emoji reaction pesan AI (terpisah) -->
<div id="reactEmojiPopup" class="hidden" role="menu">
  <div class="react-emojis">
    <button data-emoji="👍" aria-label="Suka">👍</button>
    <button data-emoji="❤️" aria-label="Love">❤️</button>
    <button data-emoji="😂" aria-label="Ketawa">😂</button>
    <button data-emoji="😮" aria-label="Kaget">😮</button>
    <button data-emoji="😢" aria-label="Sedih">😢</button>
    <button data-emoji="🙏" aria-label="Terima kasih">🙏</button>
  </div>
</div>

<!-- Popup aksi pesan AI: hapus, salin, pilih (terpisah) -->
<div id="reactActPopup" class="hidden" role="menu">
  <div class="react-actions">
    <button class="icon-btn" id="reactDelete" data-i18n-aria="del" aria-label="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    <button class="icon-btn" id="reactCopy" data-i18n-aria="copy" aria-label="Salin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    <button class="icon-btn" id="reactSelect" aria-label="Pilih teks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M5 5h11l-2.5 3.5L16 12H5"/></svg></button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
